version: "3.9"
    
services:
  db:
    image: mysql:5.7
    command: --ignore-db-dir=lost+found
    ports:
      - 3306
    volumes:
      - db_data:/var/lib/mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: somewordpress
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
    
  myapp:
    depends_on:
      - db
    build:
      context: ./
      additional_contexts:
          - test=/tmp/test
          - test_relative==./tst_rel/../../exists
          - nginx:latest=docker-image://nginx:1.30.5
    ports:
      - "8000:80"
    restart: always

volumes:
  db_data: {}
